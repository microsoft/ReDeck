<!-- Local skill: attach to a relevant visual edge; use only one or two annotations on a slide. -->
<style>
  .skill-annotation {
    max-width: 420px;
    padding: 4px 0 4px 14px;
    border-left: 4px solid var(--accent);
  }
  .skill-annotation strong {
    display: block;
    margin-bottom: 4px;
    color: var(--accent-text);
    font-size: 14px;
    line-height: 1.1;
    text-transform: uppercase;
  }
  .skill-annotation p {
    margin: 0;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.24;
  }
</style>
<aside class="skill-annotation">
  <strong>{{annotation_role}}</strong>
  <p>{{supported_interpretation_or_scope}}</p>
</aside>
