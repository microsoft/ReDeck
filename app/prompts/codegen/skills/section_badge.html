<!--
  SKILL: Section Label Badge
  Use when: marking distinct sections, stages, or categories within a slide

  KEY RULES:
  - Small pill-shaped or rectangular badge
  - Placed ABOVE the section header
  - Uses uppercase text, small font (10-12px)
  - Multiple styles from subtle to prominent
-->

<style>
  /* Pill badge — light (most common) */
  .section-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 4px 14px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .section-badge.light {
    background: rgba(PRIMARY_RGB, 0.08);
    color: PRIMARY_DARK;
  }
  /* Accent style: colored background */
  .section-badge.accent {
    background: PRIMARY_DARK;
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  /* Outline style: just border */
  .section-badge.outline {
    background: transparent;
    color: PRIMARY_MID;
    border: 1.5px solid PRIMARY_MID;
  }
  /* Gradient style: eye-catching for key sections */
  .section-badge.gradient {
    background: linear-gradient(135deg, PRIMARY_DARK, PRIMARY_MID);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }

  /* Category label (for table sections, grouped content) */
  .category-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: PRIMARY_MID;
    margin: 16px 0 6px 0;
    padding-bottom: 4px;
    border-bottom: 2px solid rgba(PRIMARY_RGB, 0.12);
  }
</style>

<!--
  SECTION BADGE above a header:

  <div class="section-badge light">Stage 1</div>
  <h3 style="font-size:20px; color:PRIMARY_DARK;">Initial graph generation</h3>

  GRADIENT BADGE for key section:

  <div class="section-badge gradient">Key Result</div>
  <h3 style="font-size:20px; color:PRIMARY_DARK;">LLM refinement outperforms</h3>

  INLINE BADGE with metric:

  <div style="display:flex; align-items:center; gap:12px;">
    <span class="section-badge accent">Best F1</span>
    <span style="font-size:28px; font-weight:800; color:PRIMARY_DARK;">0.7907</span>
  </div>

  USE CASES:
  - "Stage 1" / "Stage 2" above method panels
  - "RESULTS" / "CONTEXT" / "METHOD" role markers
  - "Best overall" / "Our method" inline with results
  - "Key finding" / "Takeaway" before a callout

  DESIGN RULES:
  - Max 3 badges per slide (more = visual clutter)
  - Text: 1-3 words only
  - Use .light on white backgrounds, .gradient for key sections
  - Use .accent sparingly (max 1 per slide)

  AVOID:
  - Using badges as the primary structural device
  - Full-width colored banners (that's a takeaway bar)
  - Badges with long text (>3 words)
-->
