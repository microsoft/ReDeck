<!--
  SKILL: Definition List / Key-Value Pairs
  Use when: presenting structured attribute-value information
  (dataset properties, model hyperparameters, method components, experimental setup)

  KEY RULES:
  - Two-column layout: term on left, definition/value on right
  - Clean alignment, no cards wrapping each pair
  - Can use alternating row shading for readability
  - Terms are bold, values are regular weight
-->

<style>
  .def-list {
    margin: 12px 0;
  }
  .def-row {
    display: flex;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    align-items: baseline;
  }
  .def-row:last-child {
    border-bottom: none;
  }
  .def-row .term {
    flex: 0 0 180px;
    font-size: 14px;
    font-weight: 700;
    color: PRIMARY_DARK;
  }
  .def-row .value {
    flex: 1;
    font-size: 14px;
    color: #333;
    line-height: 1.5;
  }
  .def-row .value strong {
    color: PRIMARY_DARK;
  }

  /* Compact variant for narrow spaces */
  .def-list.compact .def-row {
    padding: 5px 0;
  }
  .def-list.compact .term {
    font-size: 13px;
    flex: 0 0 140px;
  }
  .def-list.compact .value {
    font-size: 13px;
  }
</style>
