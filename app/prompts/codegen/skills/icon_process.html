<!--
  SKILL: Icon Process Flow
  Use when: showing a 3-5 step method overview where each step is a
  conceptual phase (not a mathematical equation or data flow)

  DIFFERENT FROM pipeline:
  - pipeline: linear box-and-arrow for data/computation flow
  - icon_process: conceptual stages with illustrative icons, for
    high-level method overviews

  DIFFERENT FROM numbered_steps:
  - numbered_steps: vertical timeline with detail panel
  - icon_process: horizontal flow with visual icons, for overview slides

  KEY RULES:
  - 3-5 stages arranged horizontally
  - Each stage: round or rounded-square icon area + label + 1-line description
  - Connecting arrows between stages
  - Below: 2-3 sentence description per stage
  - Clean, spacious layout — this is a SUMMARY, not detailed
-->
