<!--
  SKILL: Timeline / Numbered Steps
  Use when: showing a roadmap, talk outline, future directions, or ordered process

  KEY RULES:
  - Horizontal or vertical sequence of labeled steps
  - Connected by a line/arrow showing progression
  - Each step: number/marker + short title + optional 1-line description
  - Clean style: circles or small boxes connected by a thin line
-->

<style>
  /* Horizontal timeline */
  .timeline-h {
    display: flex;
    align-items: flex-start;
    gap: 0;
    margin: 24px 0;
    position: relative;
  }
  .timeline-h .step {
    flex: 1;
    text-align: center;
    position: relative;
    padding: 0 10px;
  }
  .timeline-h .connector {
    position: absolute;
    top: 16px;
    left: 0; right: 0;
    height: 2px;
    background: #ddd;
    z-index: 0;
  }
  .step-marker {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: PRIMARY_DARK; color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    position: relative; z-index: 1;
    margin-bottom: 10px;
  }
  .step-title {
    font-size: 14px; font-weight: 700; color: PRIMARY_DARK;
    margin-bottom: 4px;
  }
  .step-desc {
    font-size: 12px; color: #666; line-height: 1.4;
  }

  /* Vertical timeline (alternative) */
  .timeline-v .step {
    display: flex; gap: 16px;
    margin-bottom: 20px;
    align-items: flex-start;
  }
  .timeline-v .step-line {
    width: 2px; background: #ddd;
    position: absolute; left: 15px; top: 32px; bottom: 0;
  }
</style>

<!--
  HORIZONTAL TIMELINE (4-6 steps, good for roadmap/outline):

  <div class="timeline-h">
    <div class="connector"></div>
    <div class="step">
      <div class="step-marker">1</div>
      <div class="step-title">Problem</div>
      <div class="step-desc">Graph noise in EEG</div>
    </div>
    <div class="step">
      <div class="step-marker">2</div>
      <div class="step-title">Method</div>
      <div class="step-desc">Two-stage LLM framework</div>
    </div>
    <div class="step">
      <div class="step-marker">3</div>
      <div class="step-title">Results</div>
      <div class="step-desc">State-of-the-art F1</div>
    </div>
    ...
  </div>

  VERTICAL TIMELINE (3-4 steps, good for detailed process):

  <div class="timeline-v" style="position:relative;">
    <div class="step">
      <div class="step-marker">1</div>
      <div>
        <div class="step-title">Data collection</div>
        <div class="step-desc">5,612 EEG recordings from TUSZ v1.5.2</div>
      </div>
    </div>
    ...
  </div>

  DESIGN RULES:
  - 3-6 steps (fewer = just use text, more = too cramped)
  - Horizontal: good for overview/roadmap (equal-weight steps)
  - Vertical: good for detailed process (more room for descriptions)
  - Step titles: 1-3 words
  - Step descriptions: optional, max 10 words each
  - Connector line: thin (2px), light gray

  AVOID:
  - Mixing timeline with other complex elements (choose one visual per slide)
  - Steps with paragraph-length descriptions
  - Fancy connector shapes (zigzag, curved) — keep it simple
-->
