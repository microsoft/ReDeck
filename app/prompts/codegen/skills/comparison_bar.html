<!--
  SKILL: Comparison Bar Chart (Horizontal)
  Use when: showing win/lose, before/after, or method-vs-baseline
  comparisons as horizontal stacked or grouped bars

  DIFFERENT FROM chart:
  - chart: generic SVG line/bar chart for trends
  - comparison_bar: specifically for paired/stacked horizontal bars

  DIFFERENT FROM ablation_strip:
  - ablation_strip: single-bar per row showing component contribution
  - comparison_bar: two-color stacked bars for A-vs-B comparisons

  KEY RULES:
  - Horizontal bars (NOT vertical) — easier to label and compare
  - Two contrasting colors per bar (e.g., win=accent, lose=gray)
  - Clear percentage labels ON each bar segment
  - Right-aligned or inline labels
  - Max 6-8 rows
-->

<style>
  .cbar-container {
    position: absolute;
    left: 50px;
    top: 110px;
    width: 560px;
  }

  .cbar-row {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }
  .cbar-label {
    width: 180px;
    flex-shrink: 0;
    font-size: 13px;
    color: #2c3e50;
    text-align: right;
    padding-right: 16px;
    line-height: 1.3;
  }
  .cbar-track {
    flex: 1;
    height: 32px;
    display: flex;
    border-radius: 4px;
    overflow: hidden;
  }
  .cbar-seg-win {
    background: ACCENT;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    min-width: 30px;
  }
  .cbar-seg-lose {
    background: #dce3ea;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: #5a6977;
    min-width: 30px;
  }

  /* Legend */
  .cbar-legend {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    padding-left: 196px;
  }
  .cbar-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #5a6977;
  }
  .cbar-legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }

  /* Side interpretation panel */
  .cbar-insight {
    position: absolute;
    right: 50px;
    top: 110px;
    width: 360px;
  }
  .cbar-insight-metric {
    font-size: 13px;
    font-weight: 700;
    color: PRIMARY_DARK;
    margin-bottom: 12px;
  }
  .cbar-insight-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .cbar-insight-list li {
    font-size: 13px;
    line-height: 1.5;
    color: #3a4a5c;
    margin-bottom: 8px;
    padding-left: 16px;
    position: relative;
  }
  .cbar-insight-list li::before {
    content: '•';
    position: absolute;
    left: 0;
    color: ACCENT;
    font-weight: 700;
  }
</style>

      </div>
    </div>
    <div class="cbar-legend">
      <div class="cbar-legend-item">
        <div class="cbar-legend-dot" style="background:ACCENT;"></div>
        Win vs. baseline
      </div>

  <div class="cbar-insight">

  DESIGN RULES:
  - Bars are HORIZONTAL, stacked to 100%
  - Two colors only: accent for "positive", gray for "other"
  - Label each segment with its percentage value
  - Row labels on the left (right-aligned)
  - Max 6-8 rows (more → use a table instead)
  - Optional interpretation panel on the right

  WHEN TO USE:
  - Win/lose or win-rate comparisons
  - Before/after paired measurements
  - Scaling experiments showing improvement with more data/compute
  - Method A vs B head-to-head across settings

  AVOID:
  - More than 2 segments per bar (use grouped bars or table)
  - Vertical bars (harder to label in HTML)
  - More than 8 rows (use table + highlight instead)
-->
