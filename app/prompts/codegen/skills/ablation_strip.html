<!--
  SKILL: Ablation Strip / Component Analysis
  Use when: showing ablation study results — what happens when you
  add/remove components one at a time

  Pattern: Horizontal strip of components showing cumulative contribution,
  or SVG bar chart with delta annotations

  KEY RULES:
  - Each row/bar = one variant (full model, minus component A, minus B...)
  - Highlight the full model row
  - Show delta (Δ) for each removed component
  - Clear reading order: full → ablated variants
-->

<style>
  .ablation-container {
    position: absolute;
    left: 60px;
    top: 110px;
    width: 780px;
  }

  .ablation-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid #eef2f6;
  }

  .ablation-row.full-model {
    background: rgba(ACCENT_RGB, 0.06);
    border-radius: 8px;
    padding: 12px 14px;
    border-bottom: none;
    margin-bottom: 6px;
  }

  .ablation-name {
    width: 240px;
    font-size: 14px;
    color: #2c3e50;
    font-weight: 500;
  }
  .ablation-row.full-model .ablation-name {
    font-weight: 700;
    color: PRIMARY_DARK;
  }

  .ablation-bar-wrap {
    flex: 1;
    height: 22px;
    background: #f0f3f7;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  .ablation-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s;
  }
  .ablation-row.full-model .ablation-bar {
    background: ACCENT;
  }
  .ablation-row:not(.full-model) .ablation-bar {
    background: PRIMARY_MID;
    opacity: 0.6;
  }

  .ablation-value {
    width: 60px;
    font-size: 14px;
    font-weight: 700;
    text-align: right;
    color: PRIMARY_DARK;
  }

  .ablation-delta {
    width: 70px;
    font-size: 13px;
    font-weight: 600;
    color: #c0392b;
    text-align: right;
  }
  .ablation-delta.positive {
    color: #27ae60;
  }

  /* Right-side summary */
  .ablation-summary {
    position: absolute;
    right: 60px;
    top: 130px;
    width: 310px;
    background: #f7f9fc;
    border-radius: 12px;
    padding: 20px;
  }
  .ablation-summary h4 {
    font-size: 13px;
    font-weight: 700;
    color: PRIMARY_DARK;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
  }
  .ablation-summary li {
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 6px;
    color: #2c3e50;
  }
  .ablation-summary ul {
    padding-left: 16px;
    margin: 0;
  }
</style>

<!--
